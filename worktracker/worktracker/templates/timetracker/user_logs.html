<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>logs</title>
    <style>
        p{
            font-size: 9px;
            border-bottom: 1px solid #eee;
            font-family: monospace;
            color: #383838;
            padding-bottom: 3px;        
        }
    </style>
</head>
<body>
    <div>
        {% for log in logs %}
            <p>{{log.text}}- ({{log.created}} )</p>
        {% endfor %}
    </div>
</body>
</html>
