# نمونه‌ی Nginx برای «Teams» (reverse proxy به Gunicorn).
# کپی به: /etc/nginx/sites-available/teams  و لینک به sites-enabled.
# دامنه‌ها را جایگزین کن؛ استاتیک را WhiteNoise می‌دهد (location /static/ لازم نیست).
server {
    listen 80;
    server_name teams.example.com;      # ← دامنه‌ی خودت

    client_max_body_size 25M;           # آپلودِ فایل/عکس (سقفِ اپ ۲۰M)

    location /media/ {
        alias /var/www/teams/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://unix:/run/teams/teams.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# بعد از راه‌اندازی، برای HTTPS رایگان:
#   sudo certbot --nginx -d teams.example.com
# (certbot بلوکِ 443 و ریدایرکتِ 80→443 را خودکار اضافه می‌کند.)
