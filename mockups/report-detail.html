<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>گزارش مرداد — سئوپنل</title><link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="reports">
<div class="shell">
  <main class="main">
    <section class="card glass" style="padding:18px;display:flex;gap:12px;align-items:center;margin-bottom:14px">
      <div style="flex:1"><h1 style="font-size:19px;font-weight:700">گزارش مرداد ۱۴۰۵ — پارتیشن پارس</h1>
        <span style="font-size:12.5px;color:var(--text-faint)">بازه: ۱۴۰۵/۰۵/۰۱ تا ۱۴۰۵/۰۵/۳۱</span></div>
      <div class="side-c"><button class="btn">واکشی تسک‌ها</button><button class="btn">افزودن از بازه‌ی دیگر</button><button class="btn">ردیف دستی</button><button class="btn btn-p">چاپ / PDF</button></div>
    </section>

    <section class="card glass">
      <div class="card-h"><h3>ردیف‌های گزارش</h3><div class="side-c"><span class="chip">جابه‌جایی با drag</span></div></div>
      <table>
        <thead><tr><th style="width:26px">⋮⋮</th><th>عنوان</th><th>نوع</th><th>تاریخ نمایشی</th><th>لینک</th><th></th></tr></thead>
        <tbody>
          <tr><td style="cursor:grab;color:var(--text-faint)">⋮⋮</td><td>پارتیشن تک جداره اداری</td><td><span class="tag t-warn">آپدیت اساسی</span></td><td>۱۷ مرداد</td><td><a class="lnk" href="#">↗</a></td><td><button class="mini">حذف</button></td></tr>
          <tr><td style="cursor:grab;color:var(--text-faint)">⋮⋮</td><td>راهنمای انتخاب دیوایدر شیشه‌ای</td><td><span class="tag t-info">انتشار</span></td><td>۱۶ مرداد</td><td><a class="lnk" href="#">↗</a></td><td><button class="mini">حذف</button></td></tr>
          <tr><td style="cursor:grab;color:var(--text-faint)">⋮⋮</td><td>بهینه‌سازی سرعت سایت</td><td><span class="tag" style="background:rgba(167,139,250,.14);color:#C4B5FD">فنی</span></td><td>۱۴ مرداد</td><td class="zero">—</td><td><button class="mini">حذف</button></td></tr>
        </tbody>
      </table>
    </section>

    <section class="card glass" style="margin-top:14px">
      <div class="card-h"><h3>توضیحات گزارش</h3></div>
      <div style="padding:16px 17px"><textarea rows="4" placeholder="متن گزارش با ادیتور کامل (متن + عکس)…"></textarea></div>
    </section>

    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn">پیش‌نمایش</button><button class="btn btn-p">نهایی‌سازی</button></div>
  </main>
</div>
<script src="assets/shell.js"></script>
</body>
</html>
