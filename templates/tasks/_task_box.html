{% load seo_extras %}
<section class="card glass" style="margin-top:14px">
  <div class="card-h"><h3>{{ title }}</h3><span class="chip">{{ tasks|length|fa_digits }} مورد</span></div>
  {% if tasks %}
    <div class="tsheet-wrap">
    <table class="tsheet"{% if table_id %} id="{{ table_id }}"{% endif %}>
      <thead>{% include "tasks/_task_thead.html" %}</thead>
      <tbody>
        {% include "tasks/_rows.html" %}
      </tbody>
    </table>
    </div>
  {% else %}
    <div class="empty"><div class="ico">{{ empty_icon }}</div><h4>{{ empty_text }}</h4></div>
  {% endif %}
</section>
