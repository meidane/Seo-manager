{% load seo_extras %}
<div class="topbar glass">
  <div class="search"><span>⌕</span> جستجو در پروژه‌ها، تسک‌ها، همکاران<span class="kbd">Ctrl K</span></div>

  {% include "components/daterange.html" %}

  {% if range_start_fa %}
    <span class="range-note">{{ range_start_fa }} تا {{ range_end_fa }} — {{ range_days|fa_digits }} روز</span>
  {% endif %}

  <button class="btn btn-p" style="margin-inline-start:auto">＋ تسک جدید</button>
  {% if user.avatar %}
    <img class="avatar" src="{{ user.avatar.url }}" alt="">
  {% else %}
    <span class="avatar">{{ user.username|first|upper }}</span>
  {% endif %}
</div>
