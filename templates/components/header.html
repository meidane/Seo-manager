{% load seo_extras %}
<div class="topbar glass">
  <form class="search" method="get" action="{% url 'tasks:list' %}">
    <span>⌕</span>
    <input type="text" name="q" placeholder="جستجو در عنوان تسک‌ها…" autocomplete="off"
           style="border:0;background:transparent;color:var(--text);flex:1;outline:none;font-family:inherit;font-size:13px"
           value="{{ request.GET.q|default:'' }}">
    <input type="hidden" name="all" value="1">
  </form>

  {% include "components/daterange.html" %}

  {% if range_start_fa %}
    <span class="range-note">{{ range_start_fa }} تا {{ range_end_fa }} — {{ range_days|fa_digits }} روز</span>
  {% endif %}

  <button class="btn btn-p" id="new-task" style="margin-inline-start:auto">＋ تسک جدید</button>

  {% if my_orgs|length > 1 %}
    <select id="org-switch" class="org-switch" title="تعویض سازمان">
      {% for o in my_orgs %}<option value="{{ o.id }}" {% if o.id == current_org.id %}selected{% endif %}>{{ o.name }}</option>{% endfor %}
    </select>
  {% endif %}

  {% if user.avatar %}
    <img class="avatar" src="{{ user.avatar.url }}" alt="">
  {% else %}
    <span class="avatar">{{ user.username|first|upper }}</span>
  {% endif %}
</div>
<script>
(function(){var s=document.getElementById('org-switch');if(!s)return;
 s.onchange=function(){App.fetchJSON("{% url 'accounts:switch_org' %}",{method:'POST',body:{organization:s.value}}).then(function(){location.href='/';});};})();
</script>
