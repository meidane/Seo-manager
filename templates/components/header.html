{% load seo_extras %}
<div class="topbar glass">
  <button type="button" class="nav-toggle" id="nav-toggle" aria-label="منو">☰</button>
  <form class="search" method="get" action="{% url 'tasks:list' %}">
    <span>⌕</span>
    <input type="text" name="q" placeholder="جستجو در عنوان تسک‌ها…" autocomplete="off"
           style="border:0;background:transparent;color:var(--text);flex:1;outline:none;font-family:inherit;font-size:13px"
           value="{{ request.GET.q|default:'' }}">
    <input type="hidden" name="all" value="1">
  </form>

  {% if can_create_task %}<button class="btn btn-p" id="new-task" style="margin-inline-start:auto">＋ تسک جدید</button>{% endif %}

  {% if my_orgs|length > 1 %}
    <select id="org-switch" class="org-switch" title="تعویض سازمان">
      {% for o in my_orgs %}<option value="{{ o.id }}" {% if o.id == current_org.id %}selected{% endif %}>{{ o.name }}</option>{% endfor %}
    </select>
  {% endif %}

  <div class="notif-wrap" id="notif-wrap" style="{% if my_orgs|length <= 1 %}margin-inline-start:auto;{% endif %}">
    <button type="button" id="notif-btn" class="notif-btn" title="اعلان‌ها"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><span class="notif-badge" id="notif-badge"{% if not notif_unread %} hidden{% endif %}>{{ notif_unread }}</span></button>
    <div class="notif-drop glass" id="notif-drop" role="dialog" aria-label="اعلان‌ها">
      <div class="notif-h">
        <b>اعلان‌ها</b><span class="notif-count" id="notif-count"></span>
        <span class="notif-acts"><button type="button" class="notif-act" id="notif-clear" title="حذفِ اعلان‌های خوانده‌شده">پاک‌کردنِ خوانده‌ها</button></span>
      </div>
      <div class="notif-list" id="notif-list" data-max-id="{% if notif_recent %}{{ notif_recent.0.id }}{% else %}0{% endif %}"></div>
    </div>
    {{ notif_recent|json_script:"notif-init" }}
  </div>

  <button type="button" id="profile-btn" style="background:0;border:0;padding:0;cursor:pointer;line-height:0" title="ویرایش پروفایل">
    {% if user.avatar %}
      <img class="avatar" src="{{ user.avatar.url }}" alt="">
    {% elif user.colleague.avatar %}
      <img class="avatar" src="{{ user.colleague.avatar.url }}" alt="">
    {% else %}
      <span class="avatar"{% if user.colleague.color %} style="background:{{ user.colleague.color }}"{% endif %}>{{ user.colleague.full_name|default:user.username|first|upper }}</span>
    {% endif %}
  </button>
</div>
<script>
/* ── زنگولهٔ اعلان‌ها ── یک رندرکنندهٔ واحد (بارِ اول از json_script، بعد پولِ ۶۰ثانیه‌ای).
   باز کردن = خوانده‌شدنِ همه؛ کلیک روی اعلان = رفتن به تسک؛ × = حذف. اعلانِ «انجام‌شده» را سرور خودش پاک می‌کند
   (Notification.cleanup: تسکِ حذف/تکمیل/بازبینی‌شده). */
(function(){
  var btn=document.getElementById('notif-btn'), drop=document.getElementById('notif-drop'),
      badge=document.getElementById('notif-badge'), list=document.getElementById('notif-list'),
      countEl=document.getElementById('notif-count');
  if(!btn) return;
  var SV='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  var ICONS={
    assigned: SV+'<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>',
    review: SV+'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
    needs_fix: SV+'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
    approved: SV+'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>',
    info: SV+'<path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>'
  };
  var X=SV.replace('width="16" height="16"','width="13" height="13"')+'<path d="M18 6L6 18M6 6l12 12"/></svg>';
  function esc(t){ return String(t||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function item(n){
    return '<div class="notif-item'+(n.read?'':' unread')+'" data-id="'+n.id+'" data-url="'+esc(n.url)+'" role="link" tabindex="0">'+
      '<span class="notif-ico k-'+esc(n.kind)+'">'+(ICONS[n.kind]||ICONS.info)+'</span>'+
      '<span class="notif-body"><span class="notif-txt">'+esc(n.text)+'</span>'+
      '<span class="notif-meta" title="'+esc(n.date)+'">'+esc(n.ago)+' · '+esc(n.date)+'</span></span>'+
      '<button type="button" class="notif-x" title="حذفِ این اعلان" aria-label="حذف">'+X+'</button></div>';
  }
  function render(items){
    var unread=items.filter(function(n){return !n.read;}).length;
    countEl.textContent = items.length ? (unread ? unread+' خوانده‌نشده' : '') : '';
    if(!items.length){
      list.innerHTML='<div class="notif-empty"><span class="notif-empty-ico">'+ICONS.info+'</span><b>اعلانِ تازه‌ای نیست</b><span>اعلان‌های انجام‌شده خودکار پاک می‌شوند.</span></div>';
      return;
    }
    var today=items.filter(function(n){return n.today;}), older=items.filter(function(n){return !n.today;});
    list.innerHTML=(today.length?'<div class="notif-grp">امروز</div>'+today.map(item).join(''):'')+
      (older.length?'<div class="notif-grp">قبل‌تر</div>'+older.map(item).join(''):'');
  }
  function setBadge(n){ if(n>0){ badge.textContent=n; badge.hidden=false; } else { badge.hidden=true; } }
  var items=[]; try{ items=JSON.parse(document.getElementById('notif-init').textContent)||[]; }catch(_){}
  render(items);
  async function markRead(){ try{ await App.fetchJSON("{% url 'notifications_read' %}",{method:'POST',body:{}}); }catch(_){}
    setBadge(0); }
  btn.onclick=function(e){ e.stopPropagation(); var open=drop.classList.toggle('open');
    if(open && !badge.hidden) markRead();
    if(!open) list.querySelectorAll('.notif-item.unread').forEach(function(el){el.classList.remove('unread');}); };
  document.addEventListener('click',function(e){ if(!e.target.closest('#notif-wrap') && drop.classList.contains('open')){
    drop.classList.remove('open'); list.querySelectorAll('.notif-item.unread').forEach(function(el){el.classList.remove('unread');}); } });
  list.addEventListener('click', async function(e){
    var it=e.target.closest('.notif-item'); if(!it) return;
    if(e.target.closest('.notif-x')){
      e.stopPropagation(); it.classList.add('removing');
      try{ await App.fetchJSON("{% url 'notifications_delete' %}",{method:'POST',body:{id:+it.dataset.id}}); }catch(_){ it.classList.remove('removing'); return; }
      items=items.filter(function(n){return n.id!==+it.dataset.id;});
      setTimeout(function(){ render(items); }, 160);
      return;
    }
    if(it.dataset.url && it.dataset.url!=='#') location.href=it.dataset.url;
  });
  list.addEventListener('keydown',function(e){ if(e.key==='Enter'){ var it=e.target.closest('.notif-item'); if(it&&it.dataset.url) location.href=it.dataset.url; } });
  document.getElementById('notif-clear').onclick=async function(e){ e.stopPropagation();
    try{ await App.fetchJSON("{% url 'notifications_delete' %}",{method:'POST',body:{read:true}}); }catch(_){ return; }
    try{ var d=await App.fetchJSON("{% url 'notifications_api' %}"); items=d.items; render(items); setBadge(d.unread); }catch(_){} };
  // بَجِ زندهٔ «بازبینی»ی سایدبار — بدونِ رفرش بالا/پایین می‌شود
  function setReview(n){ var b=document.getElementById('review-badge'); if(!b) return;
    if(n>0){ b.textContent=n; b.hidden=false; } else { b.hidden=true; } }
  // مبنای «اعلانِ جدید» از سرور می‌آید (بزرگ‌ترین id هنگامِ بارگذاری) تا اعلانِ رسیده
  // *بعد از* باز شدنِ صفحه در همان پولِ بعدی توست شود (نه اینکه بارِ اول باز-پایه شود).
  var lastMaxId=parseInt(list.dataset.maxId||'0',10)||0;
  async function refresh(){ try{ var d=await App.fetchJSON("{% url 'notifications_api' %}");
    setBadge(d.unread); setReview(d.review_count);
    var maxId = d.items.length ? Math.max.apply(null, d.items.map(function(n){return n.id;})) : 0;
    var fresh=d.items.filter(function(n){ return n.id>lastMaxId; });
    if(fresh.length){
      App.toast(fresh.length===1 ? fresh[0].text : fresh.length+' اعلانِ جدید','',5000);
      window.dispatchEvent(new CustomEvent('notif-poll',{detail:{unread:d.unread,review:d.review_count,fresh:fresh.length}}));
    }
    lastMaxId=Math.max(lastMaxId,maxId);
    if(!drop.classList.contains('open')){ items=d.items; render(items); }
  }catch(_){ } }
  setInterval(refresh, 60000);   // هماهنگیِ دوره‌ای (یک پولرِ واحدِ سراسری)
})();

(function(){var s=document.getElementById('org-switch');if(!s)return;
 s.onchange=function(){App.fetchJSON("{% url 'accounts:switch_org' %}",{method:'POST',body:{organization:s.value}}).then(function(){location.href='/';});};})();

document.getElementById('profile-btn').addEventListener('click', function(){
  App.openModal(`<div class="modal-h"><h3>ویرایش پروفایل</h3><button class="x" onclick="App.closeModal()">×</button></div>
    <div class="modal-b">
      <div class="grid2">
        <div class="field"><label>نام و نام خانوادگی</label><input class="input" id="pf-name" value="{{ user.get_full_name|default:user.colleague.full_name|escapejs }}"></div>
        <div class="field"><label>ایمیل</label><input class="input" id="pf-email" dir="ltr" value="{{ user.email|default:user.colleague.email|escapejs }}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>آواتار</label><input class="input" id="pf-avatar" type="file" accept="image/*"></div>
        <div class="field"><label>رنگ</label>
          <input type="color" id="pf-color" value="{{ user.colleague.color|default:'#4183F2' }}" style="width:100%;height:40px;padding:3px;background:rgba(255,255,255,.04);border:1px solid var(--stroke-soft);border-radius:var(--r-sm)">
        </div>
      </div>
    </div>
    <div class="modal-f"><button class="btn btn-p" id="pf-save">ذخیره</button><button class="btn" onclick="App.closeModal()">انصراف</button></div>`);
  document.getElementById('pf-save').onclick = async function(){
    var fd = new FormData();
    fd.append('full_name', document.getElementById('pf-name').value.trim());
    fd.append('email', document.getElementById('pf-email').value.trim());
    fd.append('color', document.getElementById('pf-color').value);
    var avatarFile = document.getElementById('pf-avatar').files[0];
    if (avatarFile) fd.append('avatar', avatarFile);
    try {
      await App.fetchJSON("{% url 'accounts:profile_edit' %}", {method: 'POST', body: fd});
      App.toast('ذخیره شد', 'ok');
      window.location.reload();
    } catch (_) {}
  };
});
</script>
