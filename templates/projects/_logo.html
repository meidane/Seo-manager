{% if project %}<span class="mini-logo" title="{{ project.name }}">{% if project.logo %}<img src="{{ project.logo.url }}" alt="">{% else %}<span class="fb" style="background:color-mix(in srgb,{{ project.color }} 24%,transparent);color:{{ project.color }}">{{ project.name|slice:':1' }}</span>{% endif %}</span>{% endif %}
