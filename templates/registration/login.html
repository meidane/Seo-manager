{% load static %}<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود — سئوپنل</title>
  <link rel="stylesheet" href="{% static 'vendor/vazirmatn/vazirmatn.css' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card glass">
    <div class="brand">
      <div class="brand-mark">س</div>
      <div><b>سئوپنل</b><span>مدیریت پروژه‌های سئو</span></div>
    </div>
    <h2>ورود به پنل</h2>
    <p class="sub">برای ادامه وارد حساب خود شوید</p>

    {% if form.errors %}
      <div class="auth-err">نام کاربری یا رمز عبور نادرست است.</div>
    {% endif %}

    <form method="post" action="{% url 'accounts:login' %}">
      {% csrf_token %}
      <div class="field">
        <label for="id_username">نام کاربری</label>
        <input type="text" name="username" id="id_username" autofocus required>
      </div>
      <div class="field">
        <label for="id_password">رمز عبور</label>
        <input type="password" name="password" id="id_password" required>
      </div>
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button type="submit" class="btn btn-p" style="width:100%;justify-content:center;margin-top:6px">ورود</button>
    </form>
  </div>
</div>
</body>
</html>
